name: Release

# Creates the GitHub Release for a version tag. The images themselves are
# built and pushed by docker.yml, which triggers on the same tag.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            TokenGuard AI ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            for the full list of changes.

            Container images:

            - `ghcr.io/${{ github.repository }}/api:${{ steps.version.outputs.tag }}`
            - `ghcr.io/${{ github.repository }}/dashboard:${{ steps.version.outputs.tag }}`

            Deployment instructions are in
            [docs/deployment.md](https://github.com/${{ github.repository }}/blob/main/docs/deployment.md).
