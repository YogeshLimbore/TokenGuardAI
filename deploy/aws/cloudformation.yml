AWSTemplateFormatVersion: "2010-09-09"
Description: TokenGuard AI Free Plan staging host with SSH-tunneled access and no public application ports

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: single EC2 host -> Docker Compose API + dashboard + PostgreSQL + Redis
    must:
      - Free Plan status ACTIVE and credit floor verified before stack mutation
      - app ports stay on host loopback; admin access only from one IPv4 /32
    ref:
      - at: docs/aws-free-tier-deployment.md
        has: deployment, access, backup, and deletion procedures
        scope: stack

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC selected by the guarded deployment script
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public default subnet selected by the guarded deployment script
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair used for emergency SSH access
  AllowedSshCidr:
    Type: String
    Description: One trusted public IPv4 address in CIDR form, for example 203.0.113.8/32
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/32$"
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small]
    Description: Kept to t3.small because this template targets the Free Tier staging profile
  RepositoryUrl:
    Type: String
    Default: https://github.com/YogeshLimbore/TokenGuardAI.git
  GitRef:
    Type: String
    Default: codex/production-aws-ready
    AllowedPattern: "^[A-Za-z0-9._/-]+$"
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: limits host entry to administrator SSH; app traffic uses SSH local forwarding
        must:
          - never add public API, dashboard, database, or cache ingress
          - SSH source remains one trusted IPv4 /32
          - VPC matches the instance subnet
        mutable: change-with-constraints
    Properties:
      GroupDescription: TokenGuard restricted administrator SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
          Description: Restricted administrator SSH
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-host"
        - Key: Project
          Value: TokenGuardAI

  Instance:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: low-cost single host for demos and early validation; local data services avoid managed-service baseline cost
        must:
          - IMDSv2 required with hop limit 1 because containers do not need instance metadata
          - encrypted root volume deletes with the staging host
          - burst credits stay in standard mode to prevent surplus credit charges
        mutable: review-required
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      CreditSpecification:
        CPUCredits: standard
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 30
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-host"
        - Key: Project
          Value: TokenGuardAI
      UserData:
        Fn::Base64: !Sub |
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec > >(tee /var/log/tokenguard-bootstrap.log | logger -t tokenguard-bootstrap -s 2>/dev/console) 2>&1

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl docker.io docker-compose-v2 git openssl

          # A 2 GiB host needs swap while building the Python/ML image and for
          # occasional traffic spikes. Swap is a guardrail, not extra capacity.
          if [ ! -f /swapfile ]; then
            fallocate -l 4G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          systemctl enable --now docker
          usermod -aG docker ubuntu
          install -d -o ubuntu -g ubuntu /opt/tokenguard
          git clone --branch '${GitRef}' --depth 1 '${RepositoryUrl}' /opt/tokenguard/app
          cd /opt/tokenguard/app

          POSTGRES_PASSWORD=$(openssl rand -hex 32)
          REDIS_PASSWORD=$(openssl rand -hex 32)
          JWT_SECRET_KEY=$(openssl rand -base64 64 | tr -d '\n')
          TOKEN_GUARD_MASTER_KEY=$(openssl rand 32 | base64 | tr '+/' '-_' | tr -d '\n')

          umask 077
          cat > .env.production <<ENV
          APP_NAME=TokenGuard AI
          APP_VERSION=1.5.0
          ENVIRONMENT=production
          DEBUG=false
          LOG_LEVEL=INFO
          LOG_FORMAT=json
          ENABLE_DOCS=false
          ALLOWED_HOSTS=localhost,127.0.0.1,api
          CORS_ALLOWED_ORIGINS=http://localhost:8501,http://127.0.0.1:8501
          FORCE_HTTPS_REDIRECT=false
          POSTGRES_DB=tokenguard
          POSTGRES_USER=tokenguard
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          REDIS_PASSWORD=$REDIS_PASSWORD
          TOKEN_GUARD_MASTER_KEY=$TOKEN_GUARD_MASTER_KEY
          JWT_SECRET_KEY=$JWT_SECRET_KEY
          JWT_ALGORITHM=HS256
          JWT_ISSUER=tokenguard
          JWT_AUDIENCE=tokenguard-api
          AUTHENTICATION_ENABLED=true
          REQUIRE_PROJECT_AUTHENTICATION=true
          REQUIRE_ADMIN_AUTHENTICATION=true
          ALLOW_PUBLIC_REGISTRATION=false
          REQUIRE_EMAIL_VERIFICATION=false
          POLICY_ENFORCEMENT_ENABLED=true
          BUDGET_ENFORCEMENT_ENABLED=true
          RATE_LIMITING_ENABLED=true
          PROMPT_INJECTION_DETECTION_ENABLED=true
          PII_DETECTION_ENABLED=true
          PII_DEFAULT_ACTION=redact
          OUTPUT_SECRET_SCAN_ENABLED=true
          STORE_RAW_SECURITY_CONTENT=false
          ENABLE_PROMETHEUS_METRICS=false
          ENABLE_OPENTELEMETRY=false
          SEMANTIC_CACHE_ENABLED=false
          OPENROUTER_API_KEY=
          OPENAI_API_KEY=
          ANTHROPIC_API_KEY=
          GROQ_API_KEY=
          ENV
          chown ubuntu:ubuntu .env.production
          chmod 600 .env.production

          COMPOSE_BAKE=false docker compose -f docker-compose.aws.yml build
          docker compose -f docker-compose.aws.yml up -d

          cat > /usr/local/sbin/tokenguard-backup <<'BACKUP'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          cd /opt/tokenguard/app
          install -d -m 700 /opt/tokenguard/backups
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          docker compose -f docker-compose.aws.yml exec -T postgres pg_dump \
            -U tokenguard -d tokenguard -Fc > "/opt/tokenguard/backups/$stamp.dump"
          find /opt/tokenguard/backups -type f -name '*.dump' -mtime +7 -delete
          BACKUP
          chmod 700 /usr/local/sbin/tokenguard-backup

          cat > /etc/systemd/system/tokenguard-backup.service <<'UNIT'
          [Unit]
          Description=TokenGuard PostgreSQL backup
          After=docker.service
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/tokenguard-backup
          UNIT
          cat > /etc/systemd/system/tokenguard-backup.timer <<'TIMER'
          [Unit]
          Description=Daily TokenGuard PostgreSQL backup
          [Timer]
          OnCalendar=*-*-* 03:15:00 UTC
          Persistent=true
          RandomizedDelaySec=900
          [Install]
          WantedBy=timers.target
          TIMER
          systemctl daemon-reload
          systemctl enable --now tokenguard-backup.timer

          docker compose -f docker-compose.aws.yml ps

Outputs:
  InstanceId:
    Value: !Ref Instance
    Description: EC2 instance running the TokenGuard staging stack
  PublicIp:
    Value: !GetAtt Instance.PublicIp
    Description: Public IPv4 address used only for restricted SSH access
  ApiUrl:
    Value: http://127.0.0.1:8000
    Description: API URL after starting the SSH tunnel
  DashboardUrl:
    Value: http://127.0.0.1:8501
    Description: Dashboard URL after starting the SSH tunnel
  SshCommand:
    Value: !Sub "ssh -i <private-key.pem> ubuntu@${Instance.PublicIp}"
    Description: Template for an administrator SSH session
  SshTunnelCommand:
    Value: !Sub "ssh -N -L 8000:127.0.0.1:8000 -L 8501:127.0.0.1:8501 -i <private-key.pem> ubuntu@${Instance.PublicIp}"
    Description: Template for encrypted local access to the API and dashboard
