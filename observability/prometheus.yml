global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

# Alertmanager is not part of the Compose stack. Rules still evaluate and are
# visible under Prometheus -> Alerts; add a target here to route them.
#
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

scrape_configs:
  - job_name: tokenguard-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
